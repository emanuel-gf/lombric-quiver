[project]
name = "lombricquiver"
version = "0.1.0"
description = "A Python library for vector field and streamline animations using Earth Data Hub."
readme = "README.md"
authors = [
    { name = "emanuel.gf", email = "emanuelgoulartf@gmail.com" }
]
license = { text = "MIT" } 
classifiers = [  # Add classifiers
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.12.9",
    "bokeh>=3.7.3",
    "cartopy>=0.24.1",
    "dask[array,complete]>=2025.5.1",
    "fsspec>=2025.5.1",
    "geopandas>=1.1.0",
    "jinja2>=3.1.6",
    "manim>=0.19.0",
    "matplotlib>=3.10.3",
    "mkdocs>=1.6.1",
    "numpy>=2.2.6",
    "requests>=2.32.3",
    "scipy>=1.15.3",
    "typing>=3.10.0.0",
    "xarray>=2025.4.0",
    "zarr>=3.0.8",
]

[project.urls]  # Add URLs section
repository = "https://github.com/yourusername/lombricquiver"
documentation = "https://lombricquiver.readthedocs.io"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel] 
packages = ["src/lombricquiver"]

[project.optional-dependencies]  
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.1.0",
    "isort>=5.13.0",
    "mypy>=1.8.0",
]

[tool.uv.sources]
lombricquiver = { workspace = true }
