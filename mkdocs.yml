site_name: lombricquiver
site_url: https://emanuelgf.github.io/lombricquiver/
site_author: Emanuel Goulart
site_description: 'A documentation site for LombricQuiver, a tool for animations of Wind data.'
repo_github: https://github.com/emanuelgf/lombricquiver
copyright: 'Copyright © 2023 Emanuel Goulart'
theme:
  name: cinder
  colorscheme: dracula
  highlightjs: true
  use_color_mode_toggle: true

nav:
- Home: index.md
- About: about.md
- User Guide:
    - Getting Started: getting-started.ipynb
    - At Easy: wrapper.ipynb
    - Usage Examples: usage-example.md
    - Comparison: compare_matplotlib.ipynb
- Documentation: 
    - API Reference: api-reference.md
plugins:
  - mkdocs-jupyter:
      ignore: ['examples/*ipynb']
  
extra_css:
  - stylesheets/extra.css

extra:
  collapse_toc: true
  toc_depth: 4

